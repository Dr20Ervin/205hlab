---
services:
  prometheus:
    image: docker.io/prom/prometheus:v3.11.3
    restart: unless-stopped
    container_name: prometheus
    ports:
      - ${MNGT_IP:?MNGT_IP Not defined}:9096:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=${RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${RETENTION_SIZE:-50GB}
      - --web.external-url=https://prometheus.internal.${FQDN:?FQDN Not defined}
      - --web.enable-lifecycle
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
    networks:
      - traefik_network
      - monitoring_network
    volumes:
      - ${PROMETHEUS_DATA:?PROMETHEUS_DATA Not defined}:/prometheus
      - ${PROMETHEUS_CONFIG:?PROMETHEUS_CONFIG Not defined}/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.services.prometheus_web.loadBalancer.server.port=9090
      - traefik.http.routers.prometheus_http.service=prometheus_web
      - traefik.http.routers.prometheus_http.rule=Host(`prometheus.internal.${FQDN}`)
      - traefik.http.routers.prometheus_http.entrypoints=web
      - traefik.http.routers.prometheus_https.service=prometheus_web
      - traefik.http.routers.prometheus_https.rule=Host(`prometheus.internal.${FQDN}`)
      - traefik.http.routers.prometheus_https.entrypoints=websecure
      - traefik.http.routers.prometheus_https.tls=true
      - traefik.http.routers.prometheus_https.tls.certresolver=cloudflare
      - traefik.http.routers.prometheus_https.middlewares=authentik@docker

networks:
  traefik_network:
    external: true
  monitoring_network:
    external: true
