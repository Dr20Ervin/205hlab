---
services:
  vikunja:
    image: vikunja/vikunja:latest
    restart: unless-stopped
    container_name: vikunja
    hostname: 205hlab-vikunja
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - TZ=${TZ:-UTC}
      - VIKUNJA_SERVICE_TIMEZONE=${TZ:-UTC}
      - VIKUNJA_SERVICE_PUBLICURL=https://vikunja.${FQDN:?FQDN Not defined}/
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=${VIKUNJA_ENABLE_REGISTRATION:-false}
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SERVICE_SECRET:?VIKUNJA_SERVICE_SECRET Not defined}
      - VIKUNJA_SERVICE_IPEXTRACTIONMETHOD=xff
      - VIKUNJA_SERVICE_TRUSTEDPROXIES=${VIKUNJA_TRUSTED_PROXIES:?VIKUNJA_TRUSTED_PROXIES Not defined}
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_HOST=${POSTGRES_HOST:-postgres}
      - VIKUNJA_DATABASE_USER=${POSTGRES_USER:-vikunja_app}
      - VIKUNJA_DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD Not defined}
      - VIKUNJA_DATABASE_PORT=${POSTGRES_PORT:-5432}
      - VIKUNJA_DATABASE_DATABASE=${POSTGRES_DB:-vikunja}
      - VIKUNJA_DATABASE_SSLMODE=disable
      - VIKUNJA_FILES_BASEPATH=/app/vikunja/files
      - VIKUNJA_AUTH_OPENID_ENABLED=${VIKUNJA_OIDC_ENABLED:-true}
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_NAME=${VIKUNJA_OIDC_NAME:-authentik Login}
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL=https://authentik.${FQDN:?FQDN Not defined}/application/o/vikunja/
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_LOGOUTURL=https://authentik.${FQDN:?FQDN Not defined}/application/o/vikunja/end-session/
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID=${VIKUNJA_OIDC_CLIENT_ID:?VIKUNJA_OIDC_CLIENT_ID Not defined}
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET=${VIKUNJA_OIDC_CLIENT_SECRET:?VIKUNJA_OIDC_CLIENT_SECRET Not defined}
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_SCOPE=${VIKUNJA_OIDC_SCOPE:-openid email profile}
      - VIKUNJA_AUTH_LOCAL_ENABLED=${VIKUNJA_AUTH_LOCAL_ENABLED:-false}
      - VIKUNJA_MAILER_ENABLED=${SMTP_ENABLED:-false}
      - VIKUNJA_MAILER_HOST=${SMTP_HOST:-}
      - VIKUNJA_MAILER_PORT=${SMTP_PORT:-587}
      - VIKUNJA_MAILER_AUTHTYPE=login
      - VIKUNJA_MAILER_USERNAME=${SMTP_USER:-}
      - VIKUNJA_MAILER_PASSWORD=${SMTP_PASSWORD:-}
      - VIKUNJA_MAILER_FROMEMAIL=noreply-vikunja@${FQDN:?FQDN Not defined}
    networks:
      - traefik_network
      - postgres_network
    volumes:
      - vikunja_data:/app/vikunja/files
      - ${VIKUNJA_CONFIG_DIR:?VIKUNJA_CONFIG_DIR Not defined}:/etc/vikunja:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.services.vikunja_web.loadBalancer.server.port=3456
      - traefik.http.routers.vikunja_http.service=vikunja_web
      - traefik.http.routers.vikunja_http.rule=Host(`vikunja.${FQDN}`)
      - traefik.http.routers.vikunja_http.entrypoints=web
      - traefik.http.routers.vikunja_https.service=vikunja_web
      - traefik.http.routers.vikunja_https.rule=Host(`vikunja.${FQDN}`)
      - traefik.http.routers.vikunja_https.entrypoints=websecure
      - traefik.http.routers.vikunja_https.tls=true
      - traefik.http.routers.vikunja_https.tls.certresolver=cloudflare

networks:
  traefik_network:
    external: true
  postgres_network:
    external: true

volumes:
  vikunja_data:
    name: vikunja-data
    driver: local
