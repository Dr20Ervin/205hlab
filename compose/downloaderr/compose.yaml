---
services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.3
    restart: unless-stopped
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - ${MNGT_IP:?MNGT_IP Not defined}:${QBITTORRENT_WEBUI_PORT:-8080}:${QBITTORRENT_WEBUI_PORT:-8080}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - VPN_SERVICE_PROVIDER=${AIRVPN_SERVICE_PROVIDER:-airvpn}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${AIRVPN_WIREGUARD_PRIVATE_KEY:?AIRVPN_WIREGUARD_PRIVATE_KEY Not defined}
      - WIREGUARD_PRESHARED_KEY=${AIRVPN_WIREGUARD_PRESHARED_KEY:?AIRVPN_WIREGUARD_PRESHARED_KEY Not defined}
      - WIREGUARD_ADDRESSES=${AIRVPN_WIREGUARD_ADDRESSES:?AIRVPN_WIREGUARD_ADDRESSES Not defined}
      - SERVER_COUNTRIES=${AIRVPN_SERVER_COUNTRIES:-Romania}
      - FIREWALL_VPN_INPUT_PORTS=${TORRENTING_PORT:?TORRENTING_PORT Not defined}
    networks:
      - servarr_backend
      - traefik_network
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      # qBittorrent
      - traefik.http.services.qbittorrent_web.loadBalancer.server.port=${QBITTORRENT_WEBUI_PORT:-8080}
      - traefik.http.routers.qbittorrent_http.service=qbittorrent_web
      - traefik.http.routers.qbittorrent_http.rule=Host(`qbittorrent.${FQDN}`)
      - traefik.http.routers.qbittorrent_http.entrypoints=web
      - traefik.http.routers.qbittorrent_https.service=qbittorrent_web
      - traefik.http.routers.qbittorrent_https.rule=Host(`qbittorrent.${FQDN}`)
      - traefik.http.routers.qbittorrent_https.entrypoints=websecure
      - traefik.http.routers.qbittorrent_https.tls=true
      - traefik.http.routers.qbittorrent_https.tls.certresolver=cloudflare
      - traefik.http.routers.qbittorrent_https.middlewares=authentik@docker
      # Metube
      - traefik.http.services.metube_web.loadBalancer.server.port=8081
      - traefik.http.routers.metube_http.service=metube_web
      - traefik.http.routers.metube_http.rule=Host(`metube.${FQDN}`)
      - traefik.http.routers.metube_http.entrypoints=web
      - traefik.http.routers.metube_https.service=metube_web
      - traefik.http.routers.metube_https.rule=Host(`metube.${FQDN}`)
      - traefik.http.routers.metube_https.entrypoints=websecure
      - traefik.http.routers.metube_https.tls=true
      - traefik.http.routers.metube_https.tls.certresolver=cloudflare
      - traefik.http.routers.metube_https.middlewares=authentik@docker

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    container_name: qbittorrent
    network_mode: "service:gluetun"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 6G
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT:-8080}
      - TORRENTING_PORT=${TORRENTING_PORT:?TORRENTING_PORT Not defined}
    volumes:
      - qbittorrent_config:/config
      - ${DOWNLOADS_DIR:?DOWNLOADS_DIR Not defined}:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${QBITTORRENT_WEBUI_PORT:-8080}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    network_mode: "service:gluetun"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=022
      - LOGLEVEL=${METUBE_LOGLEVEL:-info}
      - ENABLE_ACCESSLOG=${METUBE_ENABLE_ACCESSLOG:-false}
      - DEFAULT_THEME=${METUBE_DEFAULT_THEME:-dark}
      - MAX_CONCURRENT_DOWNLOADS=${METUBE_MAX_CONCURRENT_DOWNLOADS:-3}
      - MAX_DOWNLOAD_SPEED=${METUBE_MAX_DOWNLOAD_SPEED:-0}
      - CLEAR_COMPLETED_AFTER=${METUBE_CLEAR_COMPLETED_AFTER:-0}
      - DELETE_FILE_ON_TRASHCAN=${METUBE_DELETE_FILE_ON_TRASHCAN:-false}
      - SUBSCRIPTION_DEFAULT_CHECK_INTERVAL=${METUBE_SUBSCRIPTION_DEFAULT_CHECK_INTERVAL:-60}
      - SUBSCRIPTION_SCAN_PLAYLIST_END=${METUBE_SUBSCRIPTION_SCAN_PLAYLIST_END:-50}
      - SUBSCRIPTION_MAX_SEEN_IDS=${METUBE_SUBSCRIPTION_MAX_SEEN_IDS:-50000}
      - DOWNLOAD_DIR=/downloads/videos
      - AUDIO_DOWNLOAD_DIR=/downloads/audio
      - TEMP_DIR=/downloads/temp
      - STATE_DIR=/downloads/state
      - PUBLIC_HOST_URL=https://metube.${FQDN}/download/
      - PUBLIC_HOST_AUDIO_URL=https://metube.${FQDN}/audio_download/
    volumes:
      - ${METUBE_DOWNLOADS_DIR:?METUBE_DOWNLOADS_DIR Not defined}:/downloads
      - metube_temp:/downloads/temp
      - metube_state:/downloads/state
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  qui:
    image: ghcr.io/autobrr/qui:latest
    restart: unless-stopped
    container_name: qui
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - QUI__DATABASE_ENGINE=postgres
      - QUI__DATABASE_DSN=postgres://${QUI_DATABASE_USER:-qui_app}:${QUI_DATABASE_PASSWORD:?QUI_DATABASE_PASSWORD Not defined}@${POSTGRES_HOST:?POSTGRES_HOST Not defined}:${POSTGRES_PORT:-5432}/${QUI_DATABASE_NAME:-qui}?sslmode=disable
      - QUI__DATABASE_CONNECT_TIMEOUT=10
      - QUI__DATABASE_MAX_OPEN_CONNS=25
      - QUI__DATABASE_MAX_IDLE_CONNS=5
      - QUI__DATABASE_CONN_MAX_LIFETIME=300
      - QUI__SESSION_COOKIE_SECURE=true
      - QUI__SESSION_SECRET=${QUI_SESSION_SECRET:?QUI_SESSION_SECRET Not defined}
      - QUI__METRICS_ENABLED=${QUI_METRICS_ENABLED:-true}
      - QUI__METRICS_HOST=0.0.0.0
      - QUI__METRICS_PORT=${QUI_METRICS_PORT:-9074}
      - QUI__OIDC_ENABLED=${QUI_OIDC_ENABLED:-true}
      - QUI__OIDC_ISSUER=https://authentik.${FQDN:?FQDN Not defined}/application/o/qui/
      - QUI__OIDC_CLIENT_ID=${QUI_OIDC_CLIENT_ID:?QUI_OIDC_CLIENT_ID Not defined}
      - QUI__OIDC_CLIENT_SECRET=${QUI_OIDC_CLIENT_SECRET:?QUI_OIDC_CLIENT_SECRET Not defined}
      - QUI__OIDC_REDIRECT_URL=https://qui.${FQDN:?FQDN Not defined}/api/auth/oidc/callback
      - QUI__OIDC_DISABLE_BUILT_IN_LOGIN=${QUI_OIDC_DISABLE_BUILT_IN_LOGIN:-true}
    networks:
      - traefik_network
      - servarr_backend
      - postgres_network
      - monitoring_network
    volumes:
      - qui_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7476/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.services.qui_web.loadBalancer.server.port=7476
      - traefik.http.routers.qui_http.service=qui_web
      - traefik.http.routers.qui_http.rule=Host(`qui.${FQDN}`)
      - traefik.http.routers.qui_http.entrypoints=web
      - traefik.http.routers.qui_https.service=qui_web
      - traefik.http.routers.qui_https.rule=Host(`qui.${FQDN}`)
      - traefik.http.routers.qui_https.entrypoints=websecure
      - traefik.http.routers.qui_https.tls=true
      - traefik.http.routers.qui_https.tls.certresolver=cloudflare

networks:
  servarr_backend:
    external: true
  traefik_network:
    external: true
  postgres_network:
    external: true
  monitoring_network:
    external: true

volumes:
  qui_config:
    name: qui-config
    driver: local
  qbittorrent_config:
    name: qbittorrent-config
    driver: local
  metube_temp:
    name: metube-temp
    driver: local
  metube_state:
    name: metube-state
    driver: local
