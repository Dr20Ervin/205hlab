http:
  middlewares:
    umami-feeder:
      plugin:
        umami-feeder:
          umamiHost: "http://umami:3000"
          headerIp: "X-Forwarded-For"
          trackErrors: false
          trackAllResources: false
          queueSize: 1000
          batchSize: 20
          ignoreURLs:
            - "^/api/"
            - "^/assets/"
            - "^/upload/"
            - "^/socket\\.io"
            - "^/_next/"
            - "^/_nuxt/"
            - "^/hubs/"
            - "^/imageproxy/"
            - "^/artboard/"
            - "^/outpost\\.goauthentik\\.io/"
          ignoreUserAgents:
            - "Uptime-Kuma"
          ignoreIPs:
            - "127.0.0.1"
          websites:
            "uptime.205hlab.com": "00000000-0000-0000-0000-000000000001"
            "resume.205hlab.com": "00000000-0000-0000-0000-000000000002"
            "seer.205hlab.com": "00000000-0000-0000-0000-000000000003"
            "mealie.205hlab.com": "00000000-0000-0000-0000-000000000004"
            "kavita.205hlab.com": "00000000-0000-0000-0000-000000000005"
            "metube.205hlab.com": "00000000-0000-0000-0000-000000000006"
            "it-tools.205hlab.com": "00000000-0000-0000-0000-000000000007"
            "omni.205hlab.com": "00000000-0000-0000-0000-000000000008"
            "draw.205hlab.com": "00000000-0000-0000-0000-000000000009"
            "pdf.205hlab.com": "00000000-0000-0000-0000-000000000010"
