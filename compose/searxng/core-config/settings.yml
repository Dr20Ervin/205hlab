# -----------------------------------------------------------------------------
# SearXNG Configuration for 205hlab (Official Container Architecture)
# -----------------------------------------------------------------------------
use_default_settings: true

general:
  debug: false
  instance_name: "205hlab Search"
  donation_url: false
  contact_url: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: ""
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: false
  limiter: false
  image_proxy: true
  method: "POST"

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: auto
  query_in_title: true
  infinite_scroll: false

redis:
  url: false

valkey:
  url: valkey://127.0.0.1:6379/0

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

# Disable Tor (.onion) engines that require a local Tor SOCKS proxy
engines:
  - name: ahmia
    engine: ahmia
    disabled: true
  - name: torch
    engine: torch
    disabled: true
