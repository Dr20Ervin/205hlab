---
services:
  postgres:
    image: docker.io/library/postgres:18.3
    restart: unless-stopped
    container_name: postgres
    hostname: 205hlab-pgdb
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER Not defined}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD Not defined}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=${TZ:-UTC}
    networks:
      - postgres_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: docker.io/library/adminer:latest
    restart: unless-stopped
    container_name: adminer
    hostname: 205hlab-adminer
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - TZ=${TZ:-UTC}
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - postgres_network
      - traefik_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.services.adminer_web.loadBalancer.server.port=8080
      - traefik.http.routers.adminer_http.service=adminer_web
      - traefik.http.routers.adminer_http.rule=Host(`adminer.${FQDN}`)
      - traefik.http.routers.adminer_http.entrypoints=web
      - traefik.http.routers.adminer_https.service=adminer_web
      - traefik.http.routers.adminer_https.rule=Host(`adminer.${FQDN}`)
      - traefik.http.routers.adminer_https.entrypoints=websecure
      - traefik.http.routers.adminer_https.tls=true
      - traefik.http.routers.adminer_https.tls.certresolver=cloudflare

  databasus:
    image: databasus/databasus:v3.65.0
    restart: unless-stopped
    container_name: databasus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - postgres_network
      - traefik_network
    volumes:
      - databasus_data:/databasus-data
      - ${DATABASUS_BACKUP:?DATABASUS_BACKUP Not defined}:/databasus-data/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://localhost:4005/api/v1/system/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.services.databasus_web.loadBalancer.server.port=4005
      - traefik.http.routers.databasus_http.service=databasus_web
      - traefik.http.routers.databasus_http.rule=Host(`databasus.${FQDN}`)
      - traefik.http.routers.databasus_http.entrypoints=web
      - traefik.http.routers.databasus_https.service=databasus_web
      - traefik.http.routers.databasus_https.rule=Host(`databasus.${FQDN}`)
      - traefik.http.routers.databasus_https.entrypoints=websecure
      - traefik.http.routers.databasus_https.tls=true
      - traefik.http.routers.databasus_https.tls.certresolver=cloudflare

networks:
  postgres_network:
    name: postgres_network
    driver: bridge
  traefik_network:
    external: true

volumes:
  postgres_data:
    name: postgres-data
    driver: local
  databasus_data:
    name: databasus-data
    driver: local
