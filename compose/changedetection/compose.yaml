---
services:
  changedetection:
    image: lscr.io/linuxserver/changedetection.io:latest
    restart: unless-stopped
    container_name: changedetection
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - BASE_URL=https://changedetection.internal.${FQDN:?FQDN Not defined}
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000/?stealth=1&--disable-web-security=true
      - USE_X_SETTINGS=1
    networks:
      - traefik_network
      - changedetection_network
    volumes:
      - changedetection_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.services.changedetection_web.loadBalancer.server.port=5000
      - traefik.http.routers.changedetection_http.service=changedetection_web
      - traefik.http.routers.changedetection_http.rule=Host(`changedetection.internal.${FQDN}`)
      - traefik.http.routers.changedetection_http.entrypoints=web
      - traefik.http.routers.changedetection_https.service=changedetection_web
      - traefik.http.routers.changedetection_https.rule=Host(`changedetection.internal.${FQDN}`)
      - traefik.http.routers.changedetection_https.entrypoints=websecure
      - traefik.http.routers.changedetection_https.tls=true
      - traefik.http.routers.changedetection_https.tls.certresolver=cloudflare
      - traefik.http.middlewares.cd-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.changedetection_https.middlewares=cd-headers,authentik@docker

  playwright-chrome:
    image: dgtlmoon/sockpuppetbrowser:latest
    restart: unless-stopped
    container_name: playwright-chrome
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=${MAX_CONCURRENT_CHROME_PROCESSES:-3}
    networks:
      - changedetection_network
    healthcheck:
      test: ["CMD-SHELL", "python3 /usr/src/app/docker-health-check.py --host http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  changedetection_network:
    name: changedetection_network
    driver: bridge
  traefik_network:
    external: true

volumes:
  changedetection_config:
    name: changedetection-config
    driver: local
